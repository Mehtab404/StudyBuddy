name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The tests never call Groq or MongoDB. config.py only insists that a secret of 32+ characters exists.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt adds the test-only packages (mongomock, httpx2) on top of requirements.txt
      - run: pip install -r requirements-dev.txt

      # The embedding tests download a ~100 MB model. Keep it between runs.
      - uses: actions/cache@v4
        with:
          path: backend/.model_cache
          key: embed-model-${{ hashFiles('backend/app/embeddings.py') }}

      - run: python -m unittest discover -s tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Next generates some types (such as LayoutProps) from the app folder. A fresh checkout does not have them yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Playwright drives a real browser through the app. The backend runs with a fake database and fake AI
    # (backend/e2e_server.py), so no secrets, MongoDB or Groq are involved.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Playwright starts both servers itself (see frontend/playwright.config.ts) and builds the site first
      - run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7